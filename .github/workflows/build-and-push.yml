# .github/workflows/build-and-push.yml

name: Build and Push Docker Image

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ] # Runs on pushes to the main branch
    tags: [ "v*.*.*" ]   # Runs on pushes of tags like v1.0.0
  pull_request:
    branches: [ "main" ] # Optional: Runs checks on PRs targeting main
  workflow_dispatch:      # Allows manual triggering from the Actions tab

# Environment variable for the Docker Hub image name
env:
  IMAGE_NAME: sarlalian/slackit

jobs:
  build_and_push:
    name: Build and Push to Docker Hub
    runs-on: ubuntu-latest # Use the latest Ubuntu runner

    permissions:
      contents: read      # Needed to check out the repository
      packages: write     # Needed for docker/build-push-action cache? (Usually not for Docker Hub)
      # id-token: write  # Needed for OIDC if using cloud provider auth (not needed here)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions/setup-rust-toolchain@v1
        with:
          toolchain: stable # Or specify your project's toolchain version
      - name: Check formatting
        run: cargo fmt --check
      - name: Run linters (Clippy)
        run: cargo clippy -- -D warnings # Fail on warnings
      - name: Run tests
        run: cargo test --locked # Run tests using Cargo.lock

      # --- Docker Build and Push Steps ---

      - name: Set up QEMU (for multi-platform builds, optional but good practice)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Only log in if this is not a PR event (i.e., a push to main or a tag)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }} # Use an Access Token here

      - name: Extract Docker metadata (tags and labels)
        id: meta # The ID used to reference outputs later
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }} # Use the image name defined earlier
          tags: |
            # Tag 'latest' for default branch pushes (e.g., main)
            type=raw,value=latest,enable={{is_default_branch}}
            # Tag with the git tag if this is a tag event (e.g., v1.0.1)
            type=ref,event=tag
            # Tag with the git SHA for all events (useful for specific commits)
            type=sha,prefix=,suffix=,format=short

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: . # Build context is the root of the repo
          file: ./Dockerfile # Path to the Dockerfile
          # Only push if this is not a PR event
          push: ${{ github.event_name != 'pull_request' }}
          # Use the tags generated by the metadata action
          tags: ${{ steps.meta.outputs.tags }}
          # Use the labels generated by the metadata action
          labels: ${{ steps.meta.outputs.labels }}
          # Enable build cache using GitHub Actions cache backend
          # Helps speed up builds by reusing layers from previous runs
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: Output the digest of the pushed image
      # - name: Print image digest
      #   if: github.event_name != 'pull_request'
      #   run: echo ${{ steps.build-and-push.outputs.digest }}
